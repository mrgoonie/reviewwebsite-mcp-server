name: Release

on:
  # Run on pushes to main branch (after PR is merged)
  push:
    branches: [main]
  # Also run on workflow_dispatch to manually trigger
  workflow_dispatch:

jobs:
  release:
    name: Create Release
    runs-on: ubuntu-latest
    permissions:
      contents: write  # Needed for creating releases
      issues: write    # Needed for commenting on issues
      pull-requests: write  # Needed for commenting on PRs
      
    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          fetch-depth: 0  # Important for semantic-release to analyze all commits
          persist-credentials: true  # Allow semantic-release to push via GITHUB_TOKEN
      
      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: 'npm'
      
      - name: Install dependencies
        run: npm ci
      
      - name: Build
        run: npm run build
      
      - name: Set executable permissions
        run: chmod +x dist/index.js || true
      
      - name: Configure Git
        run: |
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git config --global user.name "github-actions[bot]"
      
      - name: Verify npm token
        id: npm-check
        run: |
          if [ -z "$NPM_TOKEN" ]; then
            echo "npm_valid=false" >> "$GITHUB_OUTPUT"
            echo "⚠️ NPM_TOKEN not set - npm publishing will be skipped"
          else
            echo "//registry.npmjs.org/:_authToken=${NPM_TOKEN}" > .npmrc
            if npm whoami --registry https://registry.npmjs.org/ 2>/dev/null; then
              echo "npm_valid=true" >> "$GITHUB_OUTPUT"
              echo "✅ NPM token valid"
            else
              echo "npm_valid=false" >> "$GITHUB_OUTPUT"
              echo "⚠️ NPM_TOKEN expired/invalid - npm publishing will be skipped"
            fi
            rm -f .npmrc
          fi
        env:
          NPM_TOKEN: ${{ secrets.NPM_TOKEN }}

      - name: Disable npm publish if token invalid
        if: steps.npm-check.outputs.npm_valid == 'false'
        run: |
          echo "⚠️ Disabling npm publish due to invalid/missing NPM_TOKEN"
          node scripts/disable-npm-publish.js

      - name: Release
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          NPM_TOKEN: ${{ secrets.NPM_TOKEN }}
        run: npx semantic-release
